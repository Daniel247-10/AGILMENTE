<section class="card border rounded-4 p-3">
  <header class="d-flex align-items-center justify-content-between mb-3">
    <h2 class="fs-6 fw-bold mb-0"><i class="bi bi-images me-1"></i> Galería</h2>
    <a href="#" class="small text-decoration-none fw-bold">Ver más</a>
  </header>

  <div class="row row-cols-2 g-2">
    @for (foto of fotos; track foto.id) {
      <div class="col">
        <img
          [src]="foto.url"
          [alt]="foto.alt"
          class="gallery-thumb rounded-3 w-100"
          loading="lazy"
        />
      </div>
    }
  </div>
</section>
